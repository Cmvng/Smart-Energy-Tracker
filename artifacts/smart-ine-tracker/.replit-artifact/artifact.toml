kind = "web"
previewPath = "/"
title = "Smart i-n-E Tracker"
version = "1.0.0"
id = "artifacts/smart-ine-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20669

[services.development]
run = "pnpm --filter @workspace/smart-ine-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-ine-tracker", "run", "build" ]
publicDir = "artifacts/smart-ine-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20669"
BASE_PATH = "/"
